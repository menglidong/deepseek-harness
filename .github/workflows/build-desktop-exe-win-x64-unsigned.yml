# Build the unsigned Windows x64 desktop installer (NSIS .exe) for local use.
#
# The desktop packaging script (apps/desktop/scripts/package-target.ts) refuses
# to build win-x64 off a Windows x64 host, so no existing workflow produces this
# artifact: release.yml/ci*.yml run on Linux for npm packing, and
# ci-master.yml's "windows" job only runs Wine-based node tests. This workflow is
# a manual, credential-free build: --unsigned packaging needs no signing
# hardware and no secrets; the runner's Visual Studio C++ Build Tools compile
# the native NSIS installer helper in beforeBuild.
name: Build desktop exe (win-x64 unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: unsigned win-x64 NSIS installer
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      # pwsh (not bash): a bash step puts Git-for-Windows' usr\bin first on PATH,
      # which shadows the native System32 bsdtar with MSYS GNU tar. The release
      # scripts call `tar -tzf/-xOzf <absolute windows path>`, and MSYS tar
      # misparses the drive letter as a remote host ("Cannot connect to D").
      - name: Configure pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          $storeRoot = Join-Path $env:USERPROFILE '.local\share\pnpm\store'
          $env:PNPM_CONFIG_STORE_DIR = $storeRoot
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PNPM_CONFIG_STORE_DIR=$storeRoot"
          $storePath = @((& pnpm store path --silent 2>$null) | Where-Object { $_ -ne '' } | Select-Object -Last 1).Trim()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$storePath"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-latest-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-latest-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # The packaging script reads release settings from this local file and
      # never falls back to ambient values; unsigned packaging only needs the
      # app id and the mandatory-update origins.
      #
      # DSH_DESKTOP_AUTO_UPDATE_ENV MUST be "production" for personal/fork
      # builds: the "test" deployment bakes a mandatory-update policy with
      # authentication "feishu-test" into app.asar, and on launch the shell
      # opens a blocking modal ("登录测试环境") that blurs and freezes the
      # main window until Feishu SSO succeeds — which a local unsigned build
      # can never do. "production" is anonymous, so no dialog appears.
      #
      # Update channel (this fork): DSH_DESKTOP_UNSIGNED_UPDATE_FEED=1 bakes the
      # generic electron-updater feed into unsigned builds, DOWNLOAD_PROD_ORIGIN
      # overrides the fixed production feed origin, and the mandatory policy
      # origin points at the same Qiniu CDN host, which serves the static
      # api/v0/check_client_update object (200, no force) — never a 401, so the
      # test-auth Feishu login flow stays dormant.
      - name: Local unsigned release settings
        shell: pwsh
        env:
          CDN_HOST: ${{ secrets.CDN_HOST }}
        run: |
          # Tolerate an accidental scheme prefix / trailing slash in the CDN_HOST secret.
          $cdn = $env:CDN_HOST.Trim()
          while ($cdn -match '^[a-zA-Z][a-zA-Z0-9+.-]*://') { $cdn = ($cdn -replace '^[a-zA-Z][a-zA-Z0-9+.-]*://', '').Trim() }
          $cdn = $cdn.TrimEnd('/').Trim()
          $settings = @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness',
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production',
            'DSH_DESKTOP_UNSIGNED_UPDATE_FEED=1',
            "DOWNLOAD_PROD_ORIGIN=https://${cdn}",
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com',
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://${cdn}"
          )
          Set-Content -LiteralPath 'apps/desktop/.env.windows' -Value $settings -Encoding utf8
          Write-Host '--- .env.windows (contains origins only, no secrets) ---'
          Get-Content 'apps/desktop/.env.windows'

      - name: Package unsigned Windows installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Publish update feed to Qiniu
        shell: pwsh
        env:
          QINIU_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.BUCKET_NAME }}
          QINIU_CDN_HOST: ${{ secrets.CDN_HOST }}
          # Qiniu answered "incorrect region, please use up-z2.qiniup.com" — the bucket lives in zone z2 (South China).
          QINIU_ZONE: z2
        run: |
          $ErrorActionPreference = 'Stop'
          # Tolerate an accidental scheme prefix / trailing slash in the CDN_HOST secret.
          $cdn = $env:QINIU_CDN_HOST.Trim()
          while ($cdn -match '^[a-zA-Z][a-zA-Z0-9+.-]*://') { $cdn = ($cdn -replace '^[a-zA-Z][a-zA-Z0-9+.-]*://', '').Trim() }
          $env:QINIU_CDN_HOST = $cdn.TrimEnd('/').Trim()
          $work = Join-Path $env:RUNNER_TEMP 'qiniu-publisher'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          npm install --no-audit --no-fund qiniu@7.15.2
          node (Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\scripts\publish-qiniu.mjs') `
            (Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts') `
            $work

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts' |
            Sort-Object Length -Descending |
            Format-Table Name, Length -AutoSize | Out-String -Width 4096

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**/*
          if-no-files-found: error
          retention-days: 30
